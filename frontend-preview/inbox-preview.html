<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws://127.0.0.1:4207; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>SpeakDobre · особисті повідомлення</title><link rel="stylesheet" href="./chat.css">
<style>body{margin:0;padding:32px 18px;background:#f4f7fb;font-family:Arial,sans-serif;color:#142442}main{max-width:980px;margin:auto}.sample-note{font-size:13px;color:#526582}h1{font-size:30px}.sample-groups{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.sample-groups button{min-height:44px;border:1px solid #b7c7dc;border-radius:12px;background:white;color:#142442;padding:10px 16px;font:inherit;cursor:pointer}.sample-message{padding:24px;background:white;border:1px solid #dce4f0;border-radius:18px;min-height:240px}.sample-bubble{padding:16px;border-radius:12px;background:#eff5fc;max-width:480px;line-height:1.6}.sample-composer{display:block;width:100%;box-sizing:border-box;border:1px solid #dce4f0;border-radius:12px;padding:14px;margin-top:26px;font:inherit}button:focus-visible{outline:3px solid #087cca;outline-offset:3px}</style></head>
<body><main><p class="sample-note">ЛОКАЛЬНИЙ ПЕРЕГЛЯД · ЛИШЕ ШТУЧНІ ДАНІ · НАДСИЛАННЯ ВИМКНЕНО</p><h1>Practice Chat</h1><div id="inbox"></div><nav class="sample-groups" aria-label="Ваші групи"><button data-room="A1–A2 · Початковий">A1–A2 · Початковий</button><button data-room="Подорожі">Подорожі</button><button data-room="Ділова англійська">Ділова англійська</button></nav><section class="sample-message" id="conversation"><h2 id="selected-title">Подорожі</h2><p id="selected-message" class="sample-bubble">Це приклад групи. Відкрийте «Повідомлення», щоб повернутися до особистої розмови з модератором.</p><input class="sample-composer" disabled placeholder="Локальний перегляд: надсилання вимкнено"></section></main><script type="module" src="./inbox-preview.mjs"></script></body></html>
